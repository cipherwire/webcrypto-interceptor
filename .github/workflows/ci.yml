name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
    env:
      # Tests exercise pure modules and local E2E - skip the ~150MB Chrome download in CI
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Verify browser availability for E2E testing
        run: |
          node -e "const { resolveBrowserPath } = require('./src/util/browser'); const p = resolveBrowserPath(false) || resolveBrowserPath(true); if (!p) { console.error('Error: No compatible Chrome or Brave browser found on host for E2E integration test.'); process.exit(1); } console.log('Resolved browser for E2E testing:', p);"

      - name: Run tests
        run: npm test

      - name: Syntax-check every source file
        run: node --check capture_server.js && node --check src/cdp/session.js && node --check src/cdp/events.js && node --check src/cdp/strings.js && node --check src/cdp/dataflow.js && node --check src/cdp/vm.js && node --check src/page/stealth.js
